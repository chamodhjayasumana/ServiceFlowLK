<div class="shell">
  <header class="topbar">
    <a routerLink="/" class="brand">{{ title }}</a>
    <nav>
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      @if (auth.isAuthenticated()) {
        <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
        <a routerLink="/customers" routerLinkActive="active">Customers</a>
        @if (auth.hasRole('Owner', 'Manager')) {
          <a routerLink="/staff" routerLinkActive="active">Staff</a>
        }
        <button type="button" class="linkish" (click)="auth.logout()">Logout</button>
      } @else {
        <a routerLink="/login" routerLinkActive="active">Sign in</a>
        <a routerLink="/register" routerLinkActive="active">Register</a>
      }
    </nav>
  </header>
  <main>
    <router-outlet />
  </main>
</div>
